services:
  - type: web
    name: telegram-mod-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL   # строка подключения Neon; без неё бот работает на SQLite
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
